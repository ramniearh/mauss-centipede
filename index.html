
<!DOCTYPE html>
<!-- Centipede classroom game. AI-generated with Claude (Anthropic); review before use. Setup: see README.md -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Centipede game</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f2; --surface: #fcfcfb; --surface-2: #efeee9; --line: #dddbd4;
  --text: #0b0b0b; --text-2: #52514e; --muted: #7a7974;
  --accent: #2a78d6; --accent-ink: #ffffff;
  --series-1: #2a78d6; --series-2: #eb6834;
  --take: #b8321f; --pass: #1f6f45; --warn-bg: #fff4d6; --warn-ink: #6b4a00;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --line: #3a3936;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #9a998f;
    --accent: #3987e5; --series-1: #3987e5; --series-2: #d95926;
    --take: #e0654f; --pass: #45b07a; --warn-bg: #3a3014; --warn-ink: #f2d58a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.top { display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { font-weight: 650; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { border: 0; background: transparent; color: var(--text-2); padding: 4px 10px; font: inherit; font-size: 14px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
main.wide { max-width: 1180px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
h1 { font-size: 22px; margin: 0 0 8px; } h2 { font-size: 18px; margin: 0 0 10px; } h3 { font-size: 15px; margin: 0 0 6px; color: var(--text-2); }
p { margin: 0 0 10px; } .muted { color: var(--muted); font-size: 14px; } .small { font-size: 13px; }
label { display: block; font-size: 14px; color: var(--text-2); margin: 10px 0 4px; }
input, select { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
input.code { font-size: 28px; letter-spacing: 6px; text-align: center; text-transform: uppercase; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 600;
  padding: 11px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--take); }
.btn.block { width: 100%; margin-top: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.err { background: var(--warn-bg); color: var(--warn-ink); padding: 10px 12px; border-radius: 10px; margin: 10px 0; font-size: 14px; }
#banner { position: fixed; left: 0; right: 0; bottom: 0; background: var(--warn-bg); color: var(--warn-ink); padding: 10px 16px; text-align: center; font-size: 14px; }
.big-code { font-size: 54px; font-weight: 700; letter-spacing: 8px; text-align: center; margin: 4px 0; font-variant-numeric: tabular-nums; }
.choice { display: block; width: 100%; text-align: left; margin-top: 10px; padding: 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; cursor: pointer; }
.choice strong { display: block; margin-bottom: 2px; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; color: var(--text-2); }
/* game */
.status { font-size: 15px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 10px; }
.decide { display: grid; gap: 10px; margin-top: 12px; }
.decide button { padding: 16px; border-radius: var(--radius); border: 2px solid; background: var(--surface); font: inherit; text-align: left; cursor: pointer; color: var(--text); }
.decide button strong { display: block; font-size: 22px; letter-spacing: 1px; }
.decide .t { border-color: var(--take); } .decide .t strong { color: var(--take); }
.decide .p { border-color: var(--pass); } .decide .p strong { color: var(--pass); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; font-size: 14px; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-2); font-weight: 600; }
tr.now td { background: var(--surface-2); font-weight: 650; }
td .sub { font-size: 11px; color: var(--muted); font-weight: 400; white-space: nowrap; }
.hidden { display: none !important; }
.about { border-left: 3px solid var(--accent); padding-left: 12px; margin: 10px 0; }
.card.about { border-left: 4px solid var(--accent); }
.about p { margin: 0 0 8px; }
tr.past td { color: var(--muted); }
.you { font-size: 11px; background: var(--text); color: var(--surface); border-radius: 4px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; }
.result { font-size: 20px; font-weight: 650; margin: 6px 0; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; display: inline-block; vertical-align: -3px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
details summary { cursor: pointer; color: var(--text-2); }
/* host */
.host-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.sid { font-size: 14px; color: var(--text-2); }
.sid b { font-size: 26px; letter-spacing: 4px; color: var(--text); }
.qrs { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
.qr { text-align: center; }
.qr .box { background: #fff; padding: 10px; border-radius: 10px; display: inline-block; }
.qr .box svg { display: block; width: 240px; height: 240px; }
.qr .cap { font-weight: 650; margin-top: 8px; font-size: 18px; }
.qr .url { font-size: 12px; color: var(--muted); word-break: break-all; max-width: 280px; margin: 4px auto 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.tile .k { font-size: 13px; color: var(--text-2); }
.tile .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .g { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.legend { display: flex; gap: 16px; font-size: 14px; color: var(--text-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--text-2); font-size: 12px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover { fill: var(--text); fill-opacity: .05; }
.tip { position: fixed; pointer-events: none; background: var(--text); color: var(--surface); font-size: 13px; padding: 6px 9px; border-radius: 8px; z-index: 10; max-width: 260px; }
.cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } .qr .box svg { width: 200px; height: 200px; } }
.sessions td { font-size: 14px; }
.sessions td.act { white-space: nowrap; }
.sessions td.act .btn { padding: 5px 10px; font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <span class="brand" id="brand"></span>
  <span class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button>
  </span>
</header>
<main id="app"></main>
<div id="banner" hidden></div>
<div id="tip" class="tip" hidden></div>

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const params = new URLSearchParams(location.search);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let lang = params.get("lang") || store.get("cg_lang") || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en");
let langChosen = !!(params.get("lang") || store.get("cg_lang"));
if (!TEXT[lang]) lang = "en";
function t(key, vars) {
  let s = (TEXT[lang] && TEXT[lang][key]) ?? TEXT.en[key] ?? key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
function fmt(x) {
  const n = Number(x);
  return n.toLocaleString(lang === "pt" ? "pt-PT" : "en-GB", { maximumFractionDigits: 2 });
}
let rerender = () => {};
function setLang(l, explicit) {
  if (!TEXT[l]) return;
  lang = l;
  if (explicit) { langChosen = true; store.set("cg_lang", l); }
  document.documentElement.lang = l;
  document.title = t("title");
  $("#brand").textContent = t("title");
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  rerender();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang, true)));

// Payoffs — mirrors cg_payoffs in the database. Outcome when a game stops at step k.
// took = true: the player deciding at k (A at odd k) took/kept; took = false: nobody took
// (k = nodes + 1 for fixed-length games; any k for an ended potlatch feast).
// Returns [A, B] arrays of material points, esteem and score.
function outcome(s, k, took) {
  const r2 = x => Math.round(x * 100) / 100;
  const mover = k % 2 === 1 ? 0 : 1, o = { mat: [0, 0], est: [0, 0], pay: [0, 0] };
  if (s.game === "classic" || s.game === "ledger") {
    const L = r2(s.large0 * Math.pow(s.mult, k - 1)), S = r2(s.small0 * Math.pow(s.mult, k - 1));
    o.mat[mover] = L; o.mat[1 - mover] = S;
    if (took && s.game === "ledger") { o.est[mover] = -L; o.est[1 - mover] = L; }
  } else if (took) {
    const v = s.game === "discount" ? s.nodes - k + 1 : k;
    o.est[mover] = -v; o.est[1 - mover] = v;
  }
  const w = s.game === "classic" ? 0 : s.game === "ledger" ? Number(s.lambda) : 1;
  o.pay = [r2(o.mat[0] + w * o.est[0]), r2(o.mat[1] + w * o.est[1])];
  return o;
}
const isGift = s => s.game === "discount" || s.game === "potlatch";
function rulesText(S) {
  return t("rules_" + S.game, { n: S.nodes, m: fmt(S.mult), l: fmt(S.lambda), e: S.nodes, p: Math.round(S.cont_prob * 100) });
}
const fmtS = x => { const n = Number(x); return n > 0 ? "+" + fmt(n) : n < 0 ? "−" + fmt(-n) : "0"; };
// Backward induction for players who maximise their own score (ties: pass/give).
function predict(s) {
  if (s.game === "potlatch") return t("pred_potlatch");
  const N = s.nodes;
  let v = outcome(s, N + 1, false).pay, stop = N + 1;
  for (let k = N; k >= 1; k--) {
    const tk = outcome(s, k, true).pay, mv = k % 2 === 1 ? 0 : 1;
    if (tk[mv] > v[mv]) { v = tk; stop = k; }
  }
  if (stop > N) return t("pred_end");
  return t(isGift(s) ? "pred_keep" : "pred_take", { who: stop % 2 ? "A" : "B", k: stop });
}

// ---------------------------------------------------------------------
//  Backend calls (Supabase REST "rpc" endpoint — no external libraries)
// ---------------------------------------------------------------------
const configured = /^https:\/\//.test(CONFIG.SUPABASE_URL) && !CONFIG.SUPABASE_URL.includes("YOUR-PROJECT") && !CONFIG.SUPABASE_KEY.startsWith("YOUR-");
class ApiError extends Error { constructor(code, msg) { super(msg || code); this.code = code; } }
let netFails = 0;
async function rpc(fn, args = {}) {
  if (!configured) throw new ApiError("CONFIG");
  const headers = { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_KEY };
  if (CONFIG.SUPABASE_KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + CONFIG.SUPABASE_KEY; // legacy anon JWT
  let res;
  try {
    res = await fetch(CONFIG.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/rpc/" + fn, { method: "POST", headers, body: JSON.stringify(args) });
  } catch (e) {
    netFails++; showBanner(); throw new ApiError("NETWORK");
  }
  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch {}
  if (!res.ok) {
    if (res.status >= 500 || res.status === 0) { netFails++; showBanner(); throw new ApiError("NETWORK"); }
    netFails = 0; showBanner();
    const msg = (data && (data.message || data.hint)) || res.statusText;
    throw new ApiError(/^[A-Z_]+$/.test(msg) ? msg : "OTHER", msg);
  }
  netFails = 0; showBanner();
  return data;
}
function showBanner() {
  const b = $("#banner");
  if (netFails === 0) { b.hidden = true; return; }
  b.hidden = false;
  b.textContent = netFails >= 5 ? t("err_paused") : t("err_network");
}
function errText(e) {
  if (e.code === "CONFIG") return t("err_config");
  if (e.code === "NETWORK") return t("err_network");
  if (TEXT.en["err_" + e.code]) return t("err_" + e.code);
  return t("err_generic", { m: esc(e.message) });
}

// A simple poller that pauses while the tab is hidden and resumes immediately when shown.
function makePoller(fn, intervalFn) {
  let timer = null, stopped = false, running = false;
  async function tick() {
    if (stopped || running) return;
    running = true;
    try { await fn(); } catch (e) { /* errors are shown by fn or the banner */ }
    running = false;
    if (!stopped) timer = setTimeout(tick, document.hidden ? 15000 : intervalFn());
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !stopped) { clearTimeout(timer); tick(); } });
  tick();
  return { stop() { stopped = true; clearTimeout(timer); }, now() { clearTimeout(timer); tick(); } };
}

function route() {
  const m = location.hash.match(/^#host(?:=([0-9a-f-]{36}))?/i);
  if (m) {
    if (m[1]) { store.set("cg_host", m[1]); history.replaceState(null, "", location.pathname + location.search + "#host"); }
    return hostView();
  }
  const code = (params.get("s") || "").trim().toUpperCase();
  if (code) return studentView(code);
  landing();
}

function baseUrl() { return location.origin + location.pathname; }

// ---------------------------------------------------------------------
//  Landing page
// ---------------------------------------------------------------------
function landing() {
  app.className = "";
  rerender = () => {
    app.innerHTML = `
      <div class="card">
        <h1>${t("title")}</h1>
        ${configured ? "" : `<div class="err">${t("err_config")}</div>`}
        <label for="code">${t("enter_code")}</label>
        <input id="code" class="code" maxlength="4" autocomplete="off" autocapitalize="characters" inputmode="text">
        <button class="btn primary block" id="go">${t("continue")}</button>
      </div>
      <p class="muted" style="text-align:center"><a href="#host" id="hostlink">${t("instructor")}</a></p>`;
    const go = () => {
      const c = $("#code").value.trim().toUpperCase();
      if (c.length === 4) location.search = "?s=" + encodeURIComponent(c) + (langChosen ? "&lang=" + lang : "");
    };
    $("#go").onclick = go;
    $("#code").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    $("#hostlink").onclick = e => { e.preventDefault(); location.hash = "#host"; route(); };
  };
  setLang(lang);
}

function studentView(code) {
  app.className = "";
  const tokKey = "cg_tok_" + code;
  let token = store.get(tokKey);
  let peek = null, state = null, lastJson = "", msg = "", busy = false, poller = null;

  async function start() {
    if (token) return startPolling();
    try {
      peek = await rpc("cg_peek", { p_code: code });
      if (!langChosen && peek.lang) setLang(peek.lang); else rerender();
    } catch (e) { msg = errText(e); rerender(); }
  }

  async function join(grp) {
    if (busy) return; busy = true; msg = "";
    try {
      const r = await rpc("cg_join", { p_code: code, p_grp: grp || null });
      token = r.token; store.set(tokKey, token);
      startPolling();
    } catch (e) { msg = errText(e); rerender(); }
    busy = false;
  }

  function startPolling() {
    if (poller) poller.stop();
    poller = makePoller(async () => {
      try {
        const s = await rpc("cg_state", { p_token: token });
        if (!langChosen && s.session.lang && s.session.lang !== lang && !state) setLang(s.session.lang);
        const j = JSON.stringify(s);
        state = s;
        if (j !== lastJson) { lastJson = j; rerender(); }
      } catch (e) {
        if (e.code === "NOT_JOINED") { store.del(tokKey); token = null; state = null; poller.stop(); poller = null; start(); }
      }
    }, () => (state && state.match && state.match.status === "playing") ? 1500 : 2500);
  }

  async function act(fn, args) {
    if (busy) return; busy = true; msg = "";
    document.querySelectorAll("#app button").forEach(b => b.disabled = true);
    try {
      const s = await rpc(fn, Object.assign({ p_token: token }, args));
      state = s; lastJson = JSON.stringify(s);
    } catch (e) { msg = errText(e); }
    busy = false; rerender();
    if (poller) poller.now();
  }

  function joinScreen() {
    if (!peek) return `<div class="card"><h1>${t("title")}</h1>${msg ? `<div class="err">${msg}</div>` : `<p><span class="spinner"></span></p>`}
      <p class="muted"><a href="${esc(baseUrl())}">← ${t("enter_code")}</a></p></div>`;
    const g = params.get("g");
    const anonDesc = t("group_anon_desc");
    let groupPart = "";
    if (peek.mode === "split" && !["anon", "known"].includes(g)) {
      groupPart = `<p>${t("choose_group")}</p>
        <button class="choice" data-join="anon"><strong>${t("group_anon")}</strong><span class="muted">${anonDesc}</span></button>
        <button class="choice" data-join="known"><strong>${t("group_known")}</strong><span class="muted">${t("group_known_desc")}</span></button>`;
    } else {
      const grp = peek.mode === "split" ? g : peek.mode;
      groupPart = `<p><strong>${t(grp === "anon" ? "group_anon" : "group_known")}</strong><br>
        <span class="muted">${grp === "anon" ? anonDesc : t("group_known_desc")}</span></p>
        <button class="btn primary block" data-join="${grp}">${t("join")}</button>`;
    }
    return `<div class="card">
        <h1>${t("title")}</h1>
        ${peek.label ? `<p class="muted">${esc(peek.label)}</p>` : ""}
        ${peek.game ? `<div class="about"><p><strong>${t("game_" + peek.game)}</strong></p><p class="small">${t("intro_player_" + peek.game)}</p></div>` : ""}
        <h3>${t("privacy_title")}</h3>
        <p class="small">${t("privacy")}</p>
        ${msg ? `<div class="err">${msg}</div>` : ""}
        ${groupPart}
      </div>`;
  }

  function gameTable(s, m) {
    const S = s.session, g = S.game, N = S.nodes;
    const cur = m ? (m.status === "playing" ? m.node : m.stop_node) : null;
    const ended = !!(m && m.status === "end");
    const last = g === "potlatch" ? Math.max(4, (cur || 1) + 2) : N;
    const you = r => (m && m.role === r) ? `<span class="you">${t("you_badge")}</span>` : "";
    const cell = (o, i) => {
      if (g === "classic") return fmt(o.mat[i]);
      if (g === "ledger") return `<strong>${fmt(o.pay[i])}</strong><div class="sub">${fmt(o.mat[i])} ${t("pts_short")} · ${fmtS(o.est[i])}</div>`;
      return fmtS(o.est[i]);
    };
    let rows = "";
    for (let k = 1; k <= last; k++) {
      const o = outcome(S, k, true);
      const cls = cur && k === cur && !ended ? "now" : (cur && k < cur ? "past" : "");
      rows += `<tr class="${cls}"><td>${k}</td><td>${k % 2 ? "A" : "B"}</td><td>${cell(o, 0)}</td><td>${cell(o, 1)}</td></tr>`;
    }
    if (g === "potlatch") rows += `<tr><td>…</td><td></td><td></td><td></td></tr>`;
    const endO = outcome(S, g === "potlatch" ? 1 : N + 1, false);
    rows += `<tr class="${ended ? "now" : ""}"><td>${t(g === "potlatch" ? "feast_end" : "end")}</td><td>—</td><td>${cell(endO, 0)}</td><td>${cell(endO, 1)}</td></tr>`;
    const head = g === "classic" ? ["a_gets", "b_gets"] : g === "ledger" ? ["a_score", "b_score"] : ["a_esteem", "b_esteem"];
    return `<table><thead><tr><th>${t("step")}</th><th>${t("decides")}</th><th>${t(head[0])}${you(1)}</th><th>${t(head[1])}${you(2)}</th></tr></thead><tbody>${rows}</tbody></table>
      ${g === "ledger" ? `<p class="muted small" style="margin-top:6px">${t("score")} = ${t("pts_short")} + ${fmt(S.lambda)} × ${t("est_short")}</p>` : ""}`;
  }

  function rulesBlock(s, open, withTable = true) {
    return `<details style="margin-top:12px"${open ? " open" : ""}><summary>${t("rules_title")}</summary>
      <p class="small" style="margin-top:8px"><strong>${t("game_" + s.session.game)}</strong></p>
      <p class="small">${t("intro_player_" + s.session.game)}</p>
      <p class="small">${rulesText(s.session)}</p>
      ${withTable ? gameTable(s, null) : ""}</details>`;
  }

  function historyBlock(s) {
    const g = s.session.game, me = s.me;
    const rankLine = g !== "classic" && me.rank ? `<p class="small" style="margin-top:10px"><strong>${t("esteem_rank", { e: fmtS(me.est_total), r: me.rank, n: me.ranked })}</strong></p>` : "";
    if (!s.history.length) return rankLine ? `<div class="card">${rankLine}</div>` : "";
    const val = h => g === "classic" ? `${fmt(h.pay)} ${t("points")}` : g === "ledger" ? `${fmt(h.pay)} <span class="muted small">(${fmt(h.mat)} ${t("pts_short")} · ${fmtS(h.est)})</span>` : `${fmtS(h.est)} ${t("est_short")}`;
    const total = s.history.reduce((a, h) => a + Number(isGift(s.session) ? h.est : h.pay), 0);
    const totTxt = g === "classic" ? `${fmt(total)} ${t("points")}` : isGift(s.session) ? `${fmtS(total)} ${t("est_short")}` : `${fmt(total)}`;
    return `<div class="card"><h3>${t("history")}</h3><table><tbody>
      ${s.history.map(h => `<tr><td>${t("round_n", { n: h.round })}</td><td>${val(h)}</td></tr>`).join("")}
      <tr><td><strong>${t("total")}</strong></td><td><strong>${totTxt}</strong></td></tr></tbody></table>${rankLine}</div>`;
  }

  function pairingBlock(s) {
    const me = s.me;
    if (me.partner_code) {
      const canUndo = !(s.match && s.match.status === "playing");
      return `<div class="row" style="justify-content:space-between"><span class="pill">✓ ${t("paired_with", { c: me.partner_code })}</span>
        ${canUndo ? `<button class="btn" id="unpair" style="padding:6px 12px;font-size:14px">${t("unpair")}</button>` : ""}</div>`;
    }
    return `<h2>${t("pair_title")}</h2>
      <div class="muted" style="text-align:center">${t("your_code")}</div>
      <div class="big-code">${me.pair_code}</div>
      <label for="pc">${t("partner_code_label")}</label>
      <input id="pc" class="code" inputmode="numeric" maxlength="3" autocomplete="off">
      <button class="btn primary block" id="dopair">${t("pair_btn")}</button>
      <p class="muted small" style="margin-top:10px">${t("pair_hint")}</p>`;
  }

  function playScreen(s) {
    const m = s.match, me = s.me, S = s.session, g = S.game, N = S.nodes;
    const I = m.role - 1, O = 1 - I, gift = isGift(S);
    const roleL = m.role === 1 ? "A" : "B";
    const partner = me.grp === "known" ? t("partner_known", { c: me.partner_code ?? "?" }) : t("partner_anon");
    const stepLbl = g === "potlatch" ? `${t("step")} ${m.node}` : `${t("step")} ${m.node}/${N}`;
    let body = "";
    if (m.status === "playing") {
      const myTurn = (m.node % 2 === 1) === (m.role === 1);
      if (myTurn) {
        const now = outcome(S, m.node, true);
        const lastFixed = g !== "potlatch" && m.node >= N;
        const endO = outcome(S, N + 1, false);
        let takeTxt, passTxt;
        if (g === "classic") takeTxt = t("take_desc", { me: fmt(now.mat[I]), other: fmt(now.mat[O]) });
        else if (g === "ledger") takeTxt = t("take_desc_ledger", { mat: fmt(now.mat[I]), me: fmt(now.pay[I]), omat: fmt(now.mat[O]), other: fmt(now.pay[O]) });
        else takeTxt = t("keep_desc", { me: fmtS(now.est[I]), other: fmtS(now.est[O]) });
        if (g === "potlatch") passTxt = t("give_desc_potlatch", { p: Math.round(S.cont_prob * 100) });
        else if (lastFixed) passTxt = g === "discount" ? t("give_last_discount") : t("pass_desc_last", { me: fmt(endO.pay[I]), other: fmt(endO.pay[O]) });
        else passTxt = g === "discount" ? t("give_desc_discount") : t("pass_desc", { m: fmt(S.mult) });
        body = `<h2>${t("your_turn")} · ${stepLbl}</h2>
          <div class="decide">
            <button class="t" data-move="take"><strong>${t(gift ? "keep" : "take")}</strong>${takeTxt}</button>
            <button class="p" data-move="pass"><strong>${t(gift ? "give" : "pass")}</strong>${passTxt}</button>
          </div>`;
      } else {
        body = `<h2>${stepLbl}</h2><p><span class="spinner"></span>${t("waiting_partner")}</p>`;
      }
    } else {
      let line;
      if (m.status === "taken") {
        const mine = m.taker === m.role;
        line = t((gift ? "result_kept_" : "result_taken_") + (mine ? "me" : "partner"), { k: m.stop_node });
      } else if (m.status === "end") {
        line = g === "discount" ? t("result_end_discount") : g === "potlatch" ? t("result_end_potlatch", { k: m.stop_node - 1 }) : t("result_end");
      } else line = t("result_unfinished");
      let pay = "";
      if (m.status !== "unfinished") {
        if (g === "classic") pay = t("you_got", { me: fmt(m.my_pay) + " " + t("points"), other: fmt(m.partner_pay) });
        else if (g === "ledger") pay = t("you_got_ledger", { mat: fmt(m.my_mat), est: fmtS(m.my_est), pay: fmt(m.my_pay), opay: fmt(m.partner_pay) });
        else pay = t("you_got_est", { me: fmtS(m.my_est), other: fmtS(m.partner_est) });
      }
      body = `<p class="result">${line}</p>${pay ? `<p>${pay}</p>` : ""}
        <p class="muted"><span class="spinner"></span>${t("waiting_round")}</p>`;
    }
    return `<div class="card">
        <div class="status"><span class="pill">${t("round_n", { n: s.round.no })}</span><span class="pill">P${me.seq}</span><span><strong>${t("you_are", { r: roleL })}</strong></span><span>${partner}</span></div>
        <p class="muted small" style="margin:-4px 0 8px">${t("game_" + g)}</p>
        ${msg ? `<div class="err">${msg}</div>` : ""}
        ${body}
        <div style="margin-top:14px">${gameTable(s, m)}</div>
        ${rulesBlock(s, false, false)}
      </div>`;
  }

  function waitScreen(s) {
    const me = s.me;
    let note = t("waiting_round");
    const roundLive = s.round && s.round.status === "playing";
    if (roundLive) {
      if (me.grp === "anon") note = t("sit_out_odd");
      else if (!me.partner_code) note = t("sit_out_unpaired");
      else note = t("sit_out_partner");
    }
    return `<div class="card">
        ${me.grp === "known" ? pairingBlock(s) + `<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">` : ""}
        ${msg ? `<div class="err">${msg}</div>` : ""}
        <p><span class="spinner"></span>${note}</p>
        <p class="muted small">${t(me.grp === "anon" ? "group_anon" : "group_known")} · P${me.seq}</p>
        ${rulesBlock(s, !s.history.length)}
      </div>`;
  }

  rerender = () => {
    if (!token || !state) { app.innerHTML = joinScreen(); }
    else {
      const s = state;
      app.innerHTML = (s.match ? playScreen(s) : waitScreen(s)) + historyBlock(s);
    }
    app.querySelectorAll("[data-join]").forEach(b => b.onclick = () => join(b.dataset.join));
    app.querySelectorAll("[data-move]").forEach(b => b.onclick = () => act("cg_move", { p_match: state.match.id, p_action: b.dataset.move }));
    const dp = $("#dopair");
    if (dp) {
      const doit = () => { const v = parseInt($("#pc").value, 10); if (v >= 100 && v <= 999) act("cg_pair", { p_code: v }); };
      dp.onclick = doit; $("#pc").addEventListener("keydown", e => { if (e.key === "Enter") doit(); });
    }
    const up = $("#unpair"); if (up) up.onclick = () => act("cg_unpair", {});
  };
  setLang(lang);
  start();
}

// ---------------------------------------------------------------------
//  Instructor view
// ---------------------------------------------------------------------
function hostView() {
  app.className = "wide";
  let hostToken = store.get("cg_host");
  let hs = null, msg = "", poller = null, busy = false;
  let showQr = true, roundFilter = "all", includeLive = false, sessions = null, pinCache = sessionStorage.getItem("cg_pin") || "";
  let qrHtml = "", qrKey = "", lastHs = "", byRoundOpen = false, showRank = true, notesOpen = false;

  function stopPoll() { if (poller) { poller.stop(); poller = null; } }

  // ---------- setup screen ----------
  function setupScreen() {
    const opt = (v, k, sel) => `<option value="${v}"${sel ? " selected" : ""}>${t(k)}</option>`;
    return `
      <div class="cols">
        <div class="card">
          <h1>${t("new_session")}</h1>
          ${configured ? "" : `<div class="err">${t("err_config")}</div>`}
          ${msg ? `<div class="err">${msg}</div>` : ""}
          <label for="f_pin">${t("pin")}</label><input id="f_pin" type="password" value="${esc(pinCache)}" autocomplete="current-password">
          <label for="f_label">${t("label")}</label><input id="f_label" maxlength="80" placeholder="${esc(t("label_ph"))}">
          <label for="f_lang">${t("session_lang")}</label>
          <select id="f_lang"><option value="en"${lang === "en" ? " selected" : ""}>English</option><option value="pt"${lang === "pt" ? " selected" : ""}>Português</option></select>
          <label for="f_mode">${t("mode")}</label>
          <select id="f_mode">${opt("split", "mode_split", true)}${opt("anon", "mode_anon")}${opt("known", "mode_known")}</select>
          <div id="anonm"><label for="f_am">${t("anon_matching")}</label>
            <select id="f_am">${opt("strangers", "strangers", true)}${opt("partners", "partners")}</select></div>
          <label for="f_game">${t("game")}</label>
          <select id="f_game">${opt("classic", "game_classic", true)}${opt("discount", "game_discount")}${opt("potlatch", "game_potlatch")}${opt("ledger", "game_ledger")}</select>
          <div class="about small" id="f_about"></div>
          <div data-for="classic ledger"><label for="f_nodes">${t("nodes")}</label>
            <select id="f_nodes">${[4, 6, 8, 10].map(n => `<option${n === 6 ? " selected" : ""}>${n}</option>`).join("")}</select></div>
          <div data-for="discount"><label for="f_e">${t("endow")}</label>
            <select id="f_e">${[4, 6, 8, 10, 12].map(n => `<option${n === 10 ? " selected" : ""}>${n}</option>`).join("")}</select></div>
          <div data-for="ledger"><label for="f_lambda">${t("lambda")}</label><input id="f_lambda" type="number" min="0" max="10" step="any" value="0.3"></div>
          <div data-for="potlatch"><label for="f_cont">${t("cont")}</label><input id="f_cont" type="number" min="5" max="98" step="1" value="80"></div>
          <div class="grid2" data-for="classic ledger" style="grid-template-columns:1fr 1fr 1fr">
            <div><label for="f_l">${t("large0")}</label><input id="f_l" type="number" min="0.01" step="any" value="4"></div>
            <div><label for="f_s">${t("small0")}</label><input id="f_s" type="number" min="0" step="any" value="1"></div>
            <div><label for="f_m">${t("mult")}</label><input id="f_m" type="number" min="1" step="any" value="2"></div>
          </div>
          <p class="muted small" id="f_pred" style="margin-top:8px"></p>
          <button class="btn primary block" id="create">${t("create")}</button>
        </div>
        <div class="card">
          <h2>${t("past")}</h2>
          <div class="row"><button class="btn" id="loadpast">${t("show")}</button><button class="btn" id="expall">${t("export_all")}</button></div>
          <div id="pastlist" style="margin-top:12px">${sessions ? sessionsTable() : ""}</div>
          <p class="muted small" style="margin-top:12px">${t("pin")} ↑</p>
        </div>
      </div>`;
  }

  function sessionsTable() {
    if (!sessions.length) return `<p class="muted">—</p>`;
    return `<table class="sessions"><thead><tr><th>${t("session_id")}</th><th>${t("created")}</th><th>${t("players")}</th><th>${t("games")}</th><th></th></tr></thead><tbody>
      ${sessions.map(s => `<tr><td><strong>${esc(s.code)}</strong><br><span class="muted">${esc(s.label || "")}${s.game ? (s.label ? " · " : "") + t("game_" + s.game) : ""}</span></td>
        <td style="white-space:nowrap">${esc(String(s.created_at).slice(0, 10))}</td><td>${s.players}</td><td>${s.games}</td>
        <td class="act"><button class="btn" data-open="${s.host_token}">${t("open")}</button>
          <button class="btn" data-exp="${s.host_token}" data-code="${esc(s.code)}" data-label="${esc(s.label || "")}">CSV</button>
          <button class="btn danger" data-del="${s.host_token}" data-code="${esc(s.code)}">${t("del")}</button></td></tr>`).join("")}
      </tbody></table>`;
  }

  function wireSetup() {
    const modeSel = $("#f_mode"), am = $("#anonm");
    const syncMode = () => { am.style.display = modeSel.value === "known" ? "none" : ""; };
    modeSel.onchange = syncMode; syncMode();
    const gameSel = $("#f_game");
    const draft = () => {
      const g = gameSel.value;
      return { game: g, nodes: g === "discount" ? +$("#f_e").value : +$("#f_nodes").value,
               large0: +$("#f_l").value, small0: +$("#f_s").value, mult: +$("#f_m").value,
               lambda: +$("#f_lambda").value, cont_prob: (+$("#f_cont").value) / 100 };
    };
    const syncGame = () => {
      const d = draft();
      app.querySelectorAll("[data-for]").forEach(el => el.classList.toggle("hidden", !el.dataset.for.split(" ").includes(d.game)));
      const ok = d.large0 > d.small0 && d.mult >= 1 && d.lambda >= 0;
      $("#f_about").innerHTML = `<p>${t("intro_host_" + d.game)}</p>
        <p><strong>${t("rules_players")}:</strong> ${t("intro_player_" + d.game)} ${rulesText(d)}</p>`;
      $("#f_pred").textContent = ok ? predict(d) : "";
    };
    gameSel.onchange = syncGame;
    ["f_nodes", "f_e", "f_l", "f_s", "f_m", "f_lambda", "f_cont"].forEach(id => $("#" + id).addEventListener("input", syncGame));
    syncGame();
    const readPin = () => { pinCache = $("#f_pin").value; sessionStorage.setItem("cg_pin", pinCache); return pinCache; };
    $("#create").onclick = async () => {
      if (busy) return; busy = true; msg = "";
      try {
        const r = await rpc("cg_create_session", {
          p_pin: readPin(), p_label: $("#f_label").value, p_nodes: draft().nodes,
          p_large: +$("#f_l").value, p_small: +$("#f_s").value, p_mult: +$("#f_m").value,
          p_anon_matching: $("#f_am").value, p_lang: $("#f_lang").value, p_mode: modeSel.value,
          p_game: gameSel.value, p_lambda: +$("#f_lambda").value, p_cont: (+$("#f_cont").value) / 100,
        });
        hostToken = r.host_token; store.set("cg_host", hostToken);
        busy = false; return startDashboard();
      } catch (e) { msg = errText(e); }
      busy = false; rerender();
    };
    $("#loadpast").onclick = async () => {
      try { sessions = await rpc("cg_list_sessions", { p_pin: readPin() }); msg = ""; }
      catch (e) { msg = errText(e); }
      rerender();
    };
    $("#expall").onclick = async () => {
      try { downloadCsv(await rpc("cg_export", { p_pin: readPin() }), "centipede_all_sessions"); }
      catch (e) { msg = errText(e); rerender(); }
    };
    app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { hostToken = b.dataset.open; store.set("cg_host", hostToken); startDashboard(); });
    app.querySelectorAll("[data-exp]").forEach(b => b.onclick = async () => {
      try { downloadCsv(await rpc("cg_export", { p_host: b.dataset.exp }), fileBase(b.dataset.code, b.dataset.label)); }
      catch (e) { msg = errText(e); rerender(); }
    });
    app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      if (!confirm(t("confirm_delete", { c: b.dataset.code }))) return;
      try {
        await rpc("cg_host_delete", { p_host: b.dataset.del });
        if (store.get("cg_host") === b.dataset.del) store.del("cg_host");
        sessions = await rpc("cg_list_sessions", { p_pin: readPin() });
      } catch (e) { msg = errText(e); }
      rerender();
    });
  }

  // ---------- dashboard ----------
  function startDashboard() {
    stopPoll(); hs = null; qrKey = ""; lastHs = ""; roundFilter = "all";
    poller = makePoller(async () => {
      try {
        const s = await rpc("cg_host_state", { p_host: hostToken });
        const j = JSON.stringify(s);
        if (j !== lastHs) { lastHs = j; hs = s; rerender(); }
      } catch (e) {
        if (e.code === "NOT_HOST") { store.del("cg_host"); hostToken = null; stopPoll(); msg = errText(e); rerender(); }
      }
    }, () => 3000);
    rerender();
  }

  function joinUrl(grp) {
    const u = new URL(baseUrl());
    u.searchParams.set("s", hs.session.code);
    if (grp) u.searchParams.set("g", grp);
    u.searchParams.set("lang", hs.session.lang);
    return u.toString();
  }
  function qrSvg(text) {
    const q = qrcode(0, "M"); q.addData(text); q.make();
    return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
  }
  function buildQrs() {
    const s = hs.session;
    const key = s.code + s.mode + lang;
    if (key === qrKey) return qrHtml;
    const items = s.mode === "split" ? [["anon", t("qr_anon")], ["known", t("qr_known")]] : [[null, t("qr_all")]];
    qrHtml = `<div class="qrs">${items.map(([g, cap]) => {
      const url = joinUrl(g);
      return `<div class="qr"><div class="box">${qrSvg(url)}</div><div class="cap">${cap}</div><div class="url">${esc(url)}</div></div>`;
    }).join("")}</div>
    <p class="muted small" style="text-align:center;margin-top:10px">${t("or_go", { url: `<strong>${esc(baseUrl())}</strong>` })}: <strong>${esc(s.code)}</strong></p>`;
    qrKey = key;
    return qrHtml;
  }

  // Categories 1..M are the step at which someone took/kept; M+1 = nobody did ("End").
  function aggregate(rows, M) {
    const out = {};
    for (const g of ["anon", "known"]) {
      const r = rows.filter(x => x.grp === g);
      const counts = Array(M + 2).fill(0);
      r.forEach(x => counts[x.status === "end" ? M + 1 : Math.min(x.stop, M)]++);
      const n = r.length;
      out[g] = {
        n, counts,
        mean: n ? r.reduce((a, x) => a + x.stop, 0) / n : null,
        first: n ? counts[1] / n : null,
        end: n ? counts[M + 1] / n : null,
      };
    }
    return out;
  }
  function stepsShown() {
    const S = hs.session;
    if (S.game !== "potlatch") return S.nodes;
    return Math.max(4, ...hs.results.filter(r => r.status === "taken").map(r => r.stop));
  }
  const endLabel = () => t(hs.session.game === "potlatch" ? "feast_end" : "end");
  const pct = x => x == null ? "—" : Math.round(x * 100) + "%";

  function groupsInSession() {
    const m = hs.session.mode;
    return m === "split" ? ["anon", "known"] : [m];
  }
  const COLOR = { anon: "var(--series-1)", known: "var(--series-2)" };

  function chartSvg(agg, groups, N) { // N = number of step categories before "End"
    const W = 640, H = 250, ml = 40, mr = 8, mt = 10, mb = 30;
    const pw = W - ml - mr, ph = H - mt - mb;
    const cats = N + 1;
    let maxP = 0;
    groups.forEach(g => { const a = agg[g]; if (a.n) for (let k = 1; k <= cats; k++) maxP = Math.max(maxP, a.counts[k] / a.n); });
    const tick = maxP <= 0.5 ? 0.1 : 0.25;
    const top = Math.max(tick * 2, Math.ceil(maxP / tick - 1e-9) * tick), nT = Math.round(top / tick);
    const y = v => mt + ph - (v / top) * ph;
    const band = pw / cats, inner = band * 0.72, gap = 2;
    const bw = (inner - gap * (groups.length - 1)) / groups.length;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("chart_title"))}">`;
    for (let i = 0; i <= nT; i++) {
      const v = tick * i, yy = y(v);
      s += `<line class="grid" x1="${ml}" x2="${W - mr}" y1="${yy}" y2="${yy}"/><text x="${ml - 6}" y="${yy + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`;
    }
    for (let k = 1; k <= cats; k++) {
      const x0 = ml + (k - 1) * band + (band - inner) / 2;
      groups.forEach((g, gi) => {
        const a = agg[g]; if (!a.n) return;
        const v = a.counts[k] / a.n; if (v <= 0) return;
        const x = x0 + gi * (bw + gap), yy = y(v), h = mt + ph - yy, r = Math.min(4, bw / 2, h);
        s += `<path fill="${COLOR[g]}" d="M${x},${mt + ph} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${mt + ph} Z"/>`;
      });
      const tipTxt = groups.map(g => `${t("grp_" + g)}: ${agg[g].counts[k]}/${agg[g].n} (${agg[g].n ? Math.round(agg[g].counts[k] / agg[g].n * 100) : 0}%)`).join(" · ");
      s += `<rect class="hit" x="${ml + (k - 1) * band}" y="${mt}" width="${band}" height="${ph}" data-tip="${esc((k <= N ? t("step") + " " + k : endLabel()) + " — " + tipTxt)}"/>`;
      s += `<text x="${ml + (k - 0.5) * band}" y="${H - 10}" text-anchor="middle">${k <= N ? k : esc(endLabel())}</text>`;
    }
    s += `<line x1="${ml}" x2="${W - mr}" y1="${mt + ph}" y2="${mt + ph}" stroke="var(--text-2)" stroke-width="1"/>`;
    return s + `</svg>`;
  }

  function resultsBlock() {
    const S = hs.session, N = stepsShown(), groups = groupsInSession(), gift = isGift(S);
    const firstK = gift ? "stat_first_keep" : "stat_first";
    const endK = S.game === "discount" ? "stat_end_discount" : S.game === "potlatch" ? "stat_end_potlatch" : "stat_end";
    const live = hs.round && hs.round.status === "playing" ? hs.round.no : null;
    let rows = hs.results.filter(r => includeLive || r.round !== live);
    const roundsAvail = [...new Set(hs.results.map(r => r.round))].sort((a, b) => a - b);
    if (roundFilter !== "all") rows = rows.filter(r => r.round === +roundFilter);
    const agg = aggregate(rows, N);
    const filterUi = `<div class="row" style="margin-bottom:10px">
        <select id="rf" style="width:auto">${[`<option value="all">${t("all_rounds")}</option>`, ...roundsAvail.map(r => `<option value="${r}"${String(r) === String(roundFilter) ? " selected" : ""}>${t("round_n", { n: r })}</option>`)].join("")}</select>
        ${live ? `<label class="row" style="margin:0;gap:6px"><input type="checkbox" id="live" style="width:auto"${includeLive ? " checked" : ""}>${t("show_live")}</label>` : ""}
      </div>`;
    if (!rows.length) return `<div class="card"><h2>${t("results")}</h2>${filterUi}<p class="muted">${t("no_results")}</p></div>`;
    const tiles = groups.map(g => {
      const a = agg[g];
      const sw = groups.length > 1 ? `<span class="sw" style="background:${COLOR[g]}"></span>${t("grp_" + g)}` : t("grp_" + g);
      return `<div class="tile"><div class="g">${sw}</div><div class="k">${t("stat_games")}</div><div class="v">${a.n}</div></div>
        <div class="tile"><div class="g">${sw}</div><div class="k">${t("stat_mean")}</div><div class="v">${a.mean == null ? "—" : fmt(Math.round(a.mean * 10) / 10)}</div></div>
        <div class="tile"><div class="g">${sw}</div><div class="k">${t(firstK)}</div><div class="v">${pct(a.first)}</div></div>
        <div class="tile"><div class="g">${sw}</div><div class="k">${t(endK)}</div><div class="v">${pct(a.end)}</div></div>`;
    }).join("");
    const legend = groups.length > 1 ? `<div class="legend">${groups.map(g => `<span><span class="sw" style="background:${COLOR[g]}"></span>${t("grp_" + g)} (n=${agg[g].n})</span>`).join("")}</div>` : "";
    // by-round table (all finished games, regardless of filter)
    const byRound = roundsAvail.filter(r => includeLive || r !== live).map(r => {
      const a = aggregate(hs.results.filter(x => x.round === r), N);
      return groups.map(g => a[g].n ? `<tr><td>${r}</td><td>${t("grp_" + g)}</td><td>${a[g].n}</td><td>${fmt(Math.round(a[g].mean * 10) / 10)}</td><td>${pct(a[g].first)}</td><td>${pct(a[g].end)}</td></tr>` : "").join("");
    }).join("");
    return `<div class="card">
        <h2>${t("results")}</h2>${filterUi}
        <div class="tiles" style="grid-template-columns:repeat(${Math.min(4 * groups.length, 4)},1fr)">${tiles}</div>
        <h3 style="margin-top:16px">${t("chart_title")}</h3>${legend}
        <div class="chart">${chartSvg(agg, groups, N)}</div>
        <p class="muted small">${predict(S)} ${S.game === "potlatch" ? t("end_note_potlatch") : t(S.game === "discount" ? "end_note_gift" : "end_note", { n: N + 1 })}</p>
        <details id="byround" style="margin-top:8px"${byRoundOpen ? " open" : ""}><summary>${t("by_round")}</summary>
          <table style="margin-top:8px"><thead><tr><th>${t("round")}</th><th>${t("group")}</th><th>${t("stat_games")}</th><th>${t("stat_mean")}</th><th>${t(firstK)}</th><th>${t(endK)}</th></tr></thead><tbody>${byRound}</tbody></table>
        </details>
      </div>`;
  }

  function rankingBlock() {
    if (!hs.ranking) return "";
    const R = hs.ranking, groups = groupsInSession(), ledger = hs.session.game === "ledger";
    const btn = `<button class="btn" id="togglerank" style="padding:5px 12px;font-size:14px">${t(showRank ? "hide_rank" : "show_rank")}</button>`;
    const head = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">${t("ranking_title")}</h2>${btn}</div>`;
    if (!showRank) return `<div class="card">${head}</div>`;
    if (!R.length) return `<div class="card">${head}<p class="muted" style="margin-top:10px">${t("no_results")}</p></div>`;
    const ranked = R.map(r => ({ ...r, rank: 1 + R.filter(q => Number(q.est) > Number(r.est)).length }));
    const shown = ranked.length > 13 ? [...ranked.slice(0, 10), null, ...ranked.slice(-3)] : ranked;
    const sw = g => groups.length > 1 ? `<span class="sw" style="background:${COLOR[g]};margin-right:6px"></span>` : "";
    const rows = shown.map(r => r === null ? `<tr><td colspan="${ledger ? 5 : 4}" class="muted">…</td></tr>` :
      `<tr><td>${r.rank}</td><td>${sw(r.grp)}P${r.seq}</td><td>${fmtS(r.est)}</td>${ledger ? `<td>${fmt(r.score)}</td>` : ""}<td>${r.games}</td></tr>`).join("");
    return `<div class="card">${head}
      <table style="margin-top:10px"><thead><tr><th>#</th><th>${t("player")}</th><th>${t("esteem")}</th>${ledger ? `<th>${t("score")}</th>` : ""}<th>${t("games")}</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="muted small" style="margin-top:8px">${t("rank_note")}</p></div>`;
  }

  function controlBlock() {
    const r = hs.round, p = hs.players, groups = groupsInSession();
    const nextNo = r ? (r.status === "playing" ? r.no : r.no + 1) : 1;
    const prog = (d, tot) => `<div class="bar"><i style="width:${tot ? Math.round(d / tot * 100) : 0}%"></i></div>`;
    const players = groups.map(g => `<div class="tile"><div class="g">${groups.length > 1 ? `<span class="sw" style="background:${COLOR[g]}"></span>` : ""}${t("grp_" + g)}</div>
        <div class="v">${p[g + "_active"]}</div><div class="k">${t("connected")} · ${p[g]} ${t("joined")}${g === "known" ? "<br>" + t("pairs_formed", { n: p.pairs }) : ""}</div></div>`).join("");
    let roundInfo = `<p class="muted">${t("no_round")}</p>`;
    if (r) {
      const gm = r.games;
      roundInfo = `<p><strong>${t(r.status === "playing" ? "round_running" : "round_closed", { n: r.no })}</strong></p>` +
        groups.map(g => gm[g + "_total"] ? `<div class="small" style="margin-top:6px">${t("grp_" + g)}: ${t("games_done", { d: gm[g + "_done"], t: gm[g + "_total"] })}${prog(gm[g + "_done"], gm[g + "_total"])}</div>` : "").join("");
    }
    return `<div class="card">
        <div class="tiles">${players}</div>
        <div style="margin-top:14px">${roundInfo}</div>
        ${msg ? `<div class="err">${msg}</div>` : ""}
        <div class="row" style="margin-top:12px">
          ${r && r.status === "playing"
            ? `<button class="btn" id="endr">${t("end_round", { n: r.no })}</button><button class="btn primary" id="startr">${t("start_round", { n: nextNo + 1 })}</button>`
            : `<button class="btn primary" id="startr">${t("start_round", { n: nextNo })}</button>`}
        </div>
      </div>`;
  }

  function dashboard() {
    if (!hs) return `<div class="card"><span class="spinner"></span></div>`;
    const s = hs.session;
    return `
      <div class="card">
        <div class="host-head">
          <div><h1>${esc(s.label || t("title"))}</h1>
            <div class="sid">${t("session_id")}: <b>${esc(s.code)}</b> · ${esc(String(s.created_at).slice(0, 10))}</div>
            <div class="muted small">${t(s.mode === "split" ? "mode_split" : s.mode === "anon" ? "mode_anon" : "mode_known")}${s.mode !== "known" ? " · " + t(s.anon_matching) : ""}<br>
            <strong>${t("game_" + s.game)}</strong> · ${s.game === "discount" ? t("setting_discount", { e: s.nodes })
              : s.game === "potlatch" ? t("setting_potlatch", { p: Math.round(s.cont_prob * 100) })
              : t("setting_line", { n: s.nodes, l: fmt(s.large0), s: fmt(s.small0), m: fmt(s.mult) }) + (s.game === "ledger" ? " · " + t("setting_ledger", { l: fmt(s.lambda) }) : "")}</div></div>
          <div class="row">
            <button class="btn" id="toggleqr">${t(showQr ? "hide_qr" : "show_qr")}</button>
            <button class="btn" id="csv">${t("export_csv")}</button>
            <button class="btn" id="copylink">${t("copy_link")}</button>
            <button class="btn" id="leave">${t("leave")}</button>
            <button class="btn danger" id="delete">${t("del")}</button>
          </div>
        </div>
        ${showQr ? `<div style="margin-top:16px">${buildQrs()}</div>` : ""}
      </div>
      <div class="card about">
        <h2>${t("about_game")}: ${t("game_" + s.game)}</h2>
        <p>${t("intro_player_" + s.game)}</p>
        <p class="small">${rulesText(s)}</p>
        <details id="notes"${notesOpen ? " open" : ""}><summary>${t("instructor_notes")}</summary>
          <p class="small" style="margin-top:8px">${t("intro_host_" + s.game)}</p>
          <p class="small">${predict(s)}</p></details>
      </div>
      <div class="cols">
        <div>${controlBlock()}${rankingBlock()}</div>
        <div>${resultsBlock()}</div>
      </div>`;
  }

  function fileBase(code, label) {
    const safe = String(label || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
    return "centipede_" + code + (safe ? "_" + safe : "");
  }
  function downloadCsv(rows, base) {
    const sep = lang === "pt" ? ";" : ",";
    const cols = ["session_id", "session_label", "session_date", "game", "pairing_mode", "anon_matching", "nodes", "large0", "small0", "mult",
                  "lambda", "cont_prob", "round", "grp", "player_a", "player_b", "outcome", "stop_node", "taken_by",
                  "points_a", "points_b", "esteem_a", "esteem_b", "score_a", "score_b"];
    const cell = v => {
      if (v == null) return "";
      let s = String(v);
      if (lang === "pt" && typeof v === "number") s = s.replace(".", ",");
      return /[";,\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const csv = "﻿" + [cols.join(sep), ...rows.map(r => cols.map(c => cell(r[c])).join(sep))].join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = base + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function wireDashboard() {
    if (!hs) return;
    const on = (id, fn) => { const el = $("#" + id); if (el) el.onclick = fn; };
    on("toggleqr", () => { showQr = !showQr; rerender(); });
    on("togglerank", () => { showRank = !showRank; rerender(); });
    on("leave", () => { stopPoll(); store.del("cg_host"); hostToken = null; hs = null; rerender(); });
    on("copylink", async () => {
      const link = baseUrl() + "#host=" + hostToken;
      try { await navigator.clipboard.writeText(link); $("#copylink").textContent = t("copied"); }
      catch { prompt(t("copy_link"), link); }
      setTimeout(() => { const b = $("#copylink"); if (b) b.textContent = t("copy_link"); }, 1500);
      msg = "";
    });
    on("csv", async () => {
      try { downloadCsv(await rpc("cg_export", { p_host: hostToken }), fileBase(hs.session.code, hs.session.label)); }
      catch (e) { msg = errText(e); rerender(); }
    });
    on("delete", async () => {
      if (!confirm(t("confirm_delete", { c: hs.session.code }))) return;
      try { await rpc("cg_host_delete", { p_host: hostToken }); } catch (e) {}
      stopPoll(); store.del("cg_host"); hostToken = null; hs = null; rerender();
    });
    const run = fn => async () => {
      if (busy) return; busy = true; msg = "";
      try { hs = await rpc(fn, { p_host: hostToken }); } catch (e) { msg = errText(e); }
      busy = false; rerender();
    };
    on("startr", run("cg_host_start_round"));
    on("endr", run("cg_host_end_round"));
    const rf = $("#rf"); if (rf) rf.onchange = () => { roundFilter = rf.value; rerender(); };
    const br = $("#byround"); if (br) br.ontoggle = () => { byRoundOpen = br.open; };
    const nt = $("#notes"); if (nt) nt.ontoggle = () => { notesOpen = nt.open; };
    const lv = $("#live"); if (lv) lv.onchange = () => { includeLive = lv.checked; rerender(); };
    // chart tooltips
    const tip = $("#tip");
    app.querySelectorAll(".hit").forEach(h => {
      h.addEventListener("mousemove", e => { tip.hidden = false; tip.textContent = h.dataset.tip; tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px"; });
      h.addEventListener("mouseleave", () => { tip.hidden = true; });
    });
  }

  rerender = () => {
    $("#tip").hidden = true;
    if (hostToken) { app.innerHTML = dashboard(); wireDashboard(); }
    else { app.innerHTML = setupScreen(); wireSetup(); }
  };
  setLang(lang);
  if (hostToken) startDashboard();
}

route();
</script>
</body>
</html>
